[build]
builder = "nixpacks"
watchPatterns = [
  "apps/web/**",
  "packages/**",
  "package.json"
]
buildCommand = "npm install && cd apps/web && npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
